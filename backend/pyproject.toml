[project]
name = "jottr-backend"
version = "0.0.1"
description = "Jottr backend — local-first notes, tasks and calendar in one container"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic-settings==2.7.1",
    "authlib==1.4.0",
    "httpx==0.28.1",
    "pyjwt==2.10.1",
    "itsdangerous==2.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
